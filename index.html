<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MathCard - プレミアム微分積分暗記カード</title>
    <!-- KaTeX CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #F8FAFF;
            overscroll-behavior-y: none; /* スマホでの引っ張り更新を防止 */
        }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .backface-hidden { backface-visibility: hidden; }
        .flipped { transform: rotateY(180deg); }
        
        .bg-orb {
            position: absolute;
            width: 40%;
            aspect-ratio: 1;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.4;
            z-index: 0;
            pointer-events: none;
        }

        .animate-spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        /* 縦幅を70%に改善したカードのアスペクト比 */
        .card-aspect {
            aspect-ratio: 4 / 2.1;
        }
        @media (min-width: 640px) {
            .card-aspect { aspect-ratio: 4 / 1.96; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-2 sm:p-4 text-slate-900 relative overflow-hidden">

    <!-- 背景装飾 -->
    <div class="bg-orb top-[-10%] right-[-10%] bg-blue-100"></div>
    <div class="bg-orb bottom-[-10%] left-[-10%] bg-indigo-100"></div>

    <div id="app" class="w-full flex justify-center items-center flex-col z-10 hidden">
        <!-- ヘッダー -->
        <header class="mb-3 sm:mb-4 text-center relative z-10 select-none w-full">
            <h1 class="text-3xl sm:text-4xl font-[900] tracking-tight text-slate-900 mb-2 sm:mb-3 bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-500">
                MathCard
            </h1>
            <div class="flex flex-wrap items-center justify-center gap-1.5 sm:gap-2 text-slate-400 text-[10px] sm:text-xs font-semibold uppercase tracking-widest px-4">
                <span class="px-1.5 sm:px-2 py-0.5 rounded bg-white shadow-sm border border-slate-100 whitespace-nowrap">Swipe</span>
                <span class="whitespace-nowrap">to navigate</span>
                <span class="mx-1 opacity-30 hidden sm:inline">•</span>
                <span class="px-1.5 sm:px-2 py-0.5 rounded bg-white shadow-sm border border-slate-100 whitespace-nowrap hidden sm:inline">Space</span>
                <span class="whitespace-nowrap hidden sm:inline">to flip</span>
            </div>
        </header>

        <!-- モード＆フィルター操作系 -->
        <div class="flex w-full max-w-lg flex-col sm:flex-row items-center justify-between gap-3 mb-4 sm:mb-6 relative z-10">
            <div class="bg-white/60 backdrop-blur-md p-1.5 rounded-2xl border border-white shadow-sm flex items-center w-full sm:w-auto overflow-x-auto" id="tabs">
                <button onclick="toggleMode('all')" id="tab-all" class="flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 whitespace-nowrap">両方</button>
                <button onclick="toggleMode('differentiation')" id="tab-differentiation" class="flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 whitespace-nowrap">微分</button>
                <button onclick="toggleMode('integration')" id="tab-integration" class="flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 whitespace-nowrap">不定積分</button>
            </div>
            
            <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                <button onclick="toggleOnlyUnknown()" id="btn-only-unknown" class="h-11 px-4 sm:px-5 flex items-center justify-center gap-2 rounded-xl transition-all font-bold text-xs uppercase tracking-wider border shadow-sm flex-1 sm:flex-none bg-white text-slate-500 border-slate-200 hover:bg-slate-50">
                    👀 全て表示
                </button>
                <button onclick="shuffleCards()" class="h-11 w-11 flex-shrink-0 flex items-center justify-center rounded-xl bg-indigo-50 shadow-sm hover:shadow-indigo-100 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all text-indigo-600 border border-indigo-100/50 group">
                    <svg class="group-hover:rotate-180 transition-transform duration-700 w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
                </button>
            </div>
        </div>

        <!-- 3D カード UI -->
        <div class="relative w-full max-w-lg card-aspect perspective-1000 z-10 mx-auto px-2 sm:px-0">
            <div id="card" class="relative w-full h-full preserve-3d cursor-pointer group" onclick="toggleFlip()">
                <!-- 表面 (Question) -->
                <div class="absolute inset-0 backface-hidden bg-white rounded-[1.5rem] sm:rounded-[2rem] shadow-[0_20px_50px_rgba(0,0,0,0.04)] border border-slate-100 flex flex-col items-center justify-center p-6 sm:p-12 select-none overflow-hidden">
                    <div class="absolute top-0 left-0 w-full h-1.5 sm:h-2 opacity-20 bg-blue-500"></div>
                    
                    <div class="absolute top-6 sm:top-8 left-6 sm:left-10 flex items-center gap-3 w-full">
                        <span class="text-[10px] font-black tracking-[0.2em] text-blue-500 uppercase opacity-60">Question</span>
                        <span id="badge-known-front" class="hidden px-2 py-0.5 rounded text-[9px] font-bold bg-emerald-100 text-emerald-600 border border-emerald-200">覚えた</span>
                    </div>
                    
                    <div id="card-front" class="text-4xl sm:text-5xl text-slate-800 scale-100 sm:scale-110 flex items-center justify-center min-h-[100px] w-full px-4 overflow-hidden pointer-events-none"></div>

                    <div class="absolute bottom-6 sm:bottom-10 flex items-center gap-2 text-slate-300 text-[10px] font-bold uppercase tracking-widest flex-wrap justify-center group-hover:text-indigo-400 transition-colors pointer-events-none">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 animate-spin-slow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        タップして解答を表示
                    </div>
                </div>
                <!-- 裏面 (Answer) -->
                <div id="card-back-container" class="absolute inset-0 backface-hidden rounded-[1.5rem] sm:rounded-[2rem] shadow-[0_30px_60px_rgba(0,0,0,0.12)] border flex flex-col items-center justify-center p-6 sm:p-12 select-none overflow-hidden transition-colors duration-500 bg-[#0F172A] border-blue-500/20" style="transform: rotateY(180deg);">
                    <div id="accent-back" class="absolute top-0 left-0 w-full h-1.5 sm:h-2 opacity-100 bg-blue-500"></div>
                    <span id="back-label" class="absolute top-6 sm:top-8 left-6 sm:left-10 text-[10px] font-black tracking-[0.2em] uppercase opacity-80 text-blue-400">Answer</span>
                    
                    <div id="card-back" class="text-4xl sm:text-5xl text-white scale-100 sm:scale-110 flex items-center justify-center flex-1 w-full px-4 mb-12 sm:mb-16 pointer-events-none" style="filter: drop-shadow(0 0 15px rgba(255,255,255,0.15));"></div>
                    
                    <!-- 仕分けボタン (背面) -->
                    <div class="absolute bottom-6 sm:bottom-8 flex items-center gap-3 sm:gap-4 w-full px-6 sm:px-12 justify-center z-20">
                        <button onclick="markUnknownAndNext(event)" class="flex-1 max-w-[140px] flex items-center justify-center gap-2 px-3 sm:px-6 py-3 sm:py-3.5 bg-rose-500/10 hover:bg-rose-500/20 active:scale-95 text-rose-400 border border-rose-500/30 rounded-xl sm:rounded-2xl font-bold text-[11px] sm:text-sm transition-all">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                            もう一度
                        </button>
                        <button onclick="markKnownAndNext(event)" class="flex-1 max-w-[140px] flex items-center justify-center gap-2 px-3 sm:px-6 py-3 sm:py-3.5 bg-emerald-500/10 hover:bg-emerald-500/20 active:scale-95 text-emerald-400 border border-emerald-500/30 rounded-xl sm:rounded-2xl font-bold text-[11px] sm:text-sm transition-all">
                            <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
                            覚えた
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 進捗＆ステータス -->
        <div class="w-full max-w-lg mt-4 sm:mt-6 relative z-10 select-none px-4 sm:px-0">
            <div class="flex justify-between items-end mb-3 sm:mb-4">
                <div class="flex flex-col">
                    <span class="text-[10px] font-black text-slate-400 tracking-[0.2em] uppercase mb-0.5 sm:mb-1">Progress</span>
                    <span id="counter" class="text-xl sm:text-2xl font-black text-slate-900 font-mono tracking-tighter"></span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-[10px] font-bold text-slate-500 text-right whitespace-nowrap hidden sm:block">
                        Total Memorized:<br/>
                        <span id="memorize-count" class="text-emerald-600 text-base">0</span> / <span id="total-count">0</span>
                    </div>
                    <div id="mode-badge" class="px-2.5 sm:px-3 py-1 rounded-lg text-[9px] sm:text-[10px] font-black tracking-wider border uppercase transition-colors"></div>
                </div>
            </div>
            <div class="h-1.5 sm:h-2 w-full bg-slate-100 rounded-full overflow-hidden p-0.5 border border-slate-200/50">
                <div id="progress-bar" class="h-full rounded-full transition-all duration-700 ease-out"></div>
            </div>
        </div>

        <!-- PC向け次・前ボタン -->
        <div class="hidden sm:flex items-center gap-6 mt-4 sm:mt-6 relative z-10">
            <button onclick="prevCard()" class="w-16 sm:w-20 h-16 sm:h-20 flex items-center justify-center rounded-2xl sm:rounded-3xl bg-white shadow-sm hover:shadow-indigo-100 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all text-slate-400 hover:text-indigo-600 border border-slate-200/60">
                <svg class="w-6 h-6 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button onclick="nextCard()" class="w-16 sm:w-20 h-16 sm:h-20 flex items-center justify-center rounded-2xl sm:rounded-3xl bg-white shadow-sm hover:shadow-indigo-100 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition-all text-slate-400 hover:text-indigo-600 border border-slate-200/60">
                <svg class="w-6 h-6 sm:w-8 sm:h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
            </button>
        </div>

        <!-- リセット -->
        <div class="mt-4 sm:mt-6 flex justify-center w-full z-10 pb-2 sm:pb-0">
            <button onclick="resetSession()" class="opacity-30 hover:opacity-100 text-[10px] font-black text-slate-500 hover:text-rose-500 flex items-center gap-1.5 transition-all uppercase tracking-widest cursor-pointer">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                Reset All Data
            </button>
        </div>
    </div>

    <!-- コンプリート画面 (通常時は非表示) -->
    <div id="complete-screen" class="hidden w-full flex-col items-center justify-center z-20">
        <div class="text-center bg-white p-12 rounded-[2rem] shadow-xl border border-slate-100 max-w-md w-full">
            <span class="text-6xl block mb-6">🎉</span>
            <h2 class="text-2xl font-black tracking-tight mb-2">コンプリート！</h2>
            <p class="text-slate-500 mb-8 font-medium">対象のカードをすべて覚えました。</p>
            <button onclick="resetSession()" class="w-full flex items-center justify-center gap-2 py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 transition-all text-white rounded-xl font-bold shadow-md">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                最初からやり直す
            </button>
        </div>
    </div>

    <script>
        const INITIAL_CARDS = [
            { id: 'd1', front: "(sin x)'", back: "\\cos x", category: 'differentiation' },
            { id: 'd2', front: "(cos x)'", back: "\\color{#ef4444}{-}\\sin x", category: 'differentiation' },
            { id: 'd3', front: "(tan x)'", back: "\\frac{1}{\\cos^2 x}", category: 'differentiation' },
            { id: 'd4', front: "(log x)'", back: "\\frac{1}{x}", category: 'differentiation' },
            { id: 'd5', front: "(log_a x)'", back: "\\frac{1}{x \\log a}", category: 'differentiation' },
            { id: 'd6', front: "(a^x)'", back: "a^x \\log a", category: 'differentiation' },
            { id: 'd7', front: "(\\sqrt{x})'", back: "\\frac{1}{2\\sqrt{x}}", category: 'differentiation' },
            { id: 'd8', front: "(\\frac{1}{x})'", back: "\\color{#ef4444}{-}\\frac{1}{x^2}", category: 'differentiation' },
            { id: 'd9', front: "(log|x|)'", back: "\\frac{1}{x}", category: 'differentiation' },
            { id: 'd10', front: "(log_a|x|)'", back: "\\frac{1}{x \\log a}", category: 'differentiation' },
            { id: 'i1', front: "\\int \\sin x \\, dx", back: "\\color{#ef4444}{-}\\cos x \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i2', front: "\\int \\cos x \\, dx", back: "\\sin x \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i3', front: "\\int \\frac{dx}{\\cos^2 x}", back: "\\tan x \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i4', front: "\\int \\frac{dx}{\\sin^2 x}", back: "\\color{#ef4444}{-}\\frac{1}{\\tan x} \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i5', front: "\\int \\frac{1}{x} \\, dx", back: "\\log|x| \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i6', front: "\\int a^x \\, dx", back: "\\frac{a^x}{\\log a} \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i7', front: "\\int \\sqrt{x} \\, dx", back: "\\frac{2}{3}x\\sqrt{x} \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i8', front: "\\int \\frac{1}{x^2} \\, dx", back: "\\color{#ef4444}{-}\\frac{1}{x} \\color{#fbbf24}{+ C}", category: 'integration' },
            { id: 'i9', front: "\\int \\log x \\, dx", back: "x \\log x - x \\color{#fbbf24}{+ C}", category: 'integration' }
        ];

        let state = {
            mode: 'all',
            knownCards: [],
            onlyUnknown: false,
            cardOrder: [],
            currentIndex: 0
        };
        let isFlipped = false;
        const STORAGE_KEY = 'mathcard_vanilla_state_v1';

        const theme = {
            all: { color: 'bg-indigo-500', badgeText: 'Universal', badgeCls: 'bg-indigo-50 text-indigo-600 border-indigo-100' },
            differentiation: { color: 'bg-blue-500', badgeText: 'Derivatives', badgeCls: 'bg-blue-50 text-blue-600 border-blue-100' },
            integration: { color: 'bg-emerald-500', badgeText: 'Integrals', badgeCls: 'bg-emerald-50 text-emerald-600 border-emerald-100' }
        };

        function saveState() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state.mode = parsed.mode || 'all';
                    state.knownCards = parsed.knownCards || [];
                    state.onlyUnknown = !!parsed.onlyUnknown;
                    if (parsed.cardOrder && parsed.cardOrder.length > 0) {
                        state.cardOrder = parsed.cardOrder;
                        state.currentIndex = parsed.currentIndex || 0;
                    } else {
                        initCardOrder(state.mode, state.onlyUnknown, state.knownCards);
                    }
                } catch(e) {
                    initCardOrder('all', false, []);
                }
            } else {
                initCardOrder('all', false, []);
            }
        }

        function initCardOrder(mode, onlyUnknown, knowns) {
            let filtered = INITIAL_CARDS;
            if (mode !== 'all') {
                filtered = filtered.filter(c => c.category === mode);
            }
            if (onlyUnknown) {
                filtered = filtered.filter(c => !knowns.includes(c.id));
            }
            // シャッフル
            state.cardOrder = filtered.map(c => c.id).sort(() => Math.random() - 0.5);
            state.currentIndex = 0;
            saveState();
        }

        function renderMath(el, tex) {
            if (!el) return;
            if (window.katex) {
                katex.render(tex, el, { throwOnError: false, displayMode: true });
            } else {
                el.innerText = tex;
            }
        }

        function updateUI() {
            const appEl = document.getElementById('app');
            const completeEl = document.getElementById('complete-screen');
            
            // 全て覚えたかどうか
            if (state.cardOrder.length === 0) {
                appEl.classList.add('hidden');
                completeEl.classList.remove('hidden');
                completeEl.classList.add('flex');
                return;
            }

            appEl.classList.remove('hidden');
            completeEl.classList.add('hidden');
            completeEl.classList.remove('flex');

            const currentId = state.cardOrder[state.currentIndex];
            const currentObj = INITIAL_CARDS.find(c => c.id === currentId);

            // モードとフィルターのタブUI更新
            ['all', 'differentiation', 'integration'].forEach(m => {
                const tab = document.getElementById(`tab-${m}`);
                if (m === state.mode) {
                    tab.className = "flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 whitespace-nowrap bg-white shadow-md text-slate-900 border border-slate-100";
                } else {
                    tab.className = "flex-1 sm:flex-none px-4 sm:px-6 py-2 rounded-xl text-xs sm:text-sm font-bold transition-all duration-300 whitespace-nowrap text-slate-400 hover:text-slate-600";
                }
            });

            const unkBtn = document.getElementById('btn-only-unknown');
            if (state.onlyUnknown) {
                unkBtn.className = "h-11 px-4 sm:px-5 flex items-center justify-center gap-2 rounded-xl transition-all font-bold text-xs uppercase tracking-wider border shadow-sm flex-1 sm:flex-none bg-rose-50 text-rose-600 border-rose-200";
                unkBtn.innerText = "🔥 苦手のみ";
            } else {
                unkBtn.className = "h-11 px-4 sm:px-5 flex items-center justify-center gap-2 rounded-xl transition-all font-bold text-xs uppercase tracking-wider border shadow-sm flex-1 sm:flex-none bg-white text-slate-500 border-slate-200 hover:bg-slate-50";
                unkBtn.innerText = "👀 全て表示";
            }

            const isKnown = state.knownCards.includes(currentId);
            const knownBadge = document.getElementById('badge-known-front');
            if (isKnown) {
                knownBadge.classList.remove('hidden');
            } else {
                knownBadge.classList.add('hidden');
            }

            // カードの描画
            renderMath(document.getElementById('card-front'), currentObj.front);
            renderMath(document.getElementById('card-back'), currentObj.back);

            // カードの裏面カラーの動的変更
            const backContainer = document.getElementById('card-back-container');
            const accentBack = document.getElementById('accent-back');
            const backLabel = document.getElementById('back-label');
            const isDiff = currentObj.category === 'differentiation';
            
            if (isDiff) {
                backContainer.className = "absolute inset-0 backface-hidden rounded-[1.5rem] sm:rounded-[2rem] shadow-[0_30px_60px_rgba(0,0,0,0.12)] border flex flex-col items-center justify-center p-6 sm:p-12 select-none overflow-hidden transition-colors duration-500 bg-[#0F172A] border-blue-500/20";
                accentBack.className = "absolute top-0 left-0 w-full h-1.5 sm:h-2 opacity-100 bg-blue-500";
                backLabel.className = "absolute top-6 sm:top-8 left-6 sm:left-10 text-[10px] font-black tracking-[0.2em] uppercase opacity-80 text-blue-400";
            } else {
                backContainer.className = "absolute inset-0 backface-hidden rounded-[1.5rem] sm:rounded-[2rem] shadow-[0_30px_60px_rgba(0,0,0,0.12)] border flex flex-col items-center justify-center p-6 sm:p-12 select-none overflow-hidden transition-colors duration-500 bg-[#061A14] border-emerald-500/20";
                accentBack.className = "absolute top-0 left-0 w-full h-1.5 sm:h-2 opacity-100 bg-emerald-500";
                backLabel.className = "absolute top-6 sm:top-8 left-6 sm:left-10 text-[10px] font-black tracking-[0.2em] uppercase opacity-80 text-emerald-400";
            }

            // 進捗バー
            const counter = document.getElementById('counter');
            counter.innerHTML = `${String(state.currentIndex + 1).padStart(2, '0')} <span class="text-slate-200 text-lg sm:text-xl font-normal mx-0.5 sm:mx-1">/</span> <span class="text-slate-300 text-lg sm:text-xl font-medium">${String(state.cardOrder.length).padStart(2, '0')}</span>`;

            const percent = ((state.currentIndex + 1) / state.cardOrder.length) * 100;
            const bar = document.getElementById('progress-bar');
            bar.style.width = `${percent}%`;
            bar.className = `h-full rounded-full transition-all duration-700 ease-out ${theme[state.mode].color}`;

            // Memorize Stats
            document.getElementById('memorize-count').innerText = state.knownCards.length;
            document.getElementById('total-count').innerText = INITIAL_CARDS.length;

            const badge = document.getElementById('mode-badge');
            badge.innerText = theme[state.mode].badgeText;
            badge.className = `px-2.5 sm:px-3 py-1 rounded-lg text-[9px] sm:text-[10px] font-black tracking-wider border uppercase transition-colors ${theme[state.mode].badgeCls}`;

            // フリップ状態解除
            document.getElementById('card').classList.toggle('flipped', isFlipped);
        }

        function toggleFlip() {
            isFlipped = !isFlipped;
            document.getElementById('card').classList.toggle('flipped', isFlipped);
        }

        function nextCard() {
            if (state.cardOrder.length === 0) return;
            isFlipped = false;
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                state.currentIndex = (state.currentIndex + 1) % state.cardOrder.length;
                saveState();
                updateUI();
            }, 150);
        }

        function prevCard() {
            if (state.cardOrder.length === 0) return;
            isFlipped = false;
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                state.currentIndex = (state.currentIndex - 1 + state.cardOrder.length) % state.cardOrder.length;
                saveState();
                updateUI();
            }, 150);
        }

        function toggleMode(newMode) {
            state.mode = newMode;
            initCardOrder(newMode, state.onlyUnknown, state.knownCards);
            isFlipped = false;
            updateUI();
        }

        function toggleOnlyUnknown() {
            state.onlyUnknown = !state.onlyUnknown;
            initCardOrder(state.mode, state.onlyUnknown, state.knownCards);
            isFlipped = false;
            updateUI();
        }

        function shuffleCards() {
            initCardOrder(state.mode, state.onlyUnknown, state.knownCards);
            isFlipped = false;
            updateUI();
        }

        function resetSession() {
            state.knownCards = [];
            state.onlyUnknown = false;
            initCardOrder(state.mode, false, []);
            isFlipped = false;
            updateUI();
        }

        function markKnownAndNext(e) {
            e.stopPropagation();
            const currentId = state.cardOrder[state.currentIndex];
            if (!state.knownCards.includes(currentId)) {
                state.knownCards.push(currentId);
            }
            
            if (state.onlyUnknown) {
                isFlipped = false;
                document.getElementById('card').classList.remove('flipped');
                setTimeout(() => {
                    // カードオーダー配列から除去
                    state.cardOrder = state.cardOrder.filter(id => id !== currentId);
                    if (state.cardOrder.length > 0) {
                        state.currentIndex = state.currentIndex % state.cardOrder.length;
                    }
                    saveState();
                    updateUI();
                }, 150);
            } else {
                nextCard();
            }
        }

        function markUnknownAndNext(e) {
            e.stopPropagation();
            const currentId = state.cardOrder[state.currentIndex];
            state.knownCards = state.knownCards.filter(id => id !== currentId);
            nextCard();
        }

        // スマホ向けスワイプ処理
        let touchStartX = null;
        function handleTouchStart(e) {
            touchStartX = e.touches[0].clientX;
        }
        function handleTouchEnd(e) {
            if (touchStartX === null) return;
            let touchEndX = e.changedTouches[0].clientX;
            let delta = touchStartX - touchEndX;
            if (Math.abs(delta) > 50) {
                if (delta > 0) nextCard(); // Swipe Left
                else prevCard();           // Swipe Right
            }
            touchStartX = null;
        }

        // キーボード操作
        function handleKeyDown(e) {
            if (e.code === 'Space' && document.activeElement === document.body) {
                e.preventDefault();
                toggleFlip();
            } else if (e.code === 'ArrowRight') {
                nextCard();
            } else if (e.code === 'ArrowLeft') {
                prevCard();
            }
        }

        // --- 起動 ---
        window.onload = () => {
            // KaTeXがロードされているか少し待ってから初期化
            setTimeout(() => {
                loadState();
                updateUI();
                window.addEventListener('keydown', handleKeyDown);
                document.getElementById('card').addEventListener('touchstart', handleTouchStart);
                document.getElementById('card').addEventListener('touchend', handleTouchEnd);
            }, 100);
        };
    </script>
</body>
</html>
